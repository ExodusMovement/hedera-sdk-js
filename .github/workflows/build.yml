name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - exodus
      - main
      - develop
  pull_request:
    branches:
      - exodus
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ '22', '24' ]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Configure pnpm store
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ matrix.node }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ matrix.node }}-

      - name: Build
        run: |
          pnpm install --force --no-frozen-lockfile --ignore-scripts
          pnpm --dir packages/cryptography run compile
          pnpm --dir packages/cryptography run compile:types
          pnpm --dir packages/proto run compile
          pnpm --dir packages/proto run cp:ts
          pnpm compile:js

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ '22', '24' ]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Configure pnpm store
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ matrix.node }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ matrix.node }}-

      - name: Lint
        run: |
          pnpm install --force --no-frozen-lockfile --ignore-scripts
          pnpm --dir packages/cryptography run compile
          pnpm --dir packages/cryptography run compile:types
          pnpm --dir packages/proto run compile
          pnpm --dir packages/proto run cp:ts
          pnpm lint

  test-unit-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ '22', '24' ]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Configure pnpm store
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ matrix.node }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ matrix.node }}-

      - name: Run Unit Tests
        run: |
          pnpm install --force --no-frozen-lockfile --ignore-scripts
          pnpm --dir packages/cryptography run compile
          pnpm --dir packages/cryptography run compile:types
          pnpm --dir packages/proto run compile
          pnpm --dir packages/proto run cp:ts
          pnpm test:unit:node
